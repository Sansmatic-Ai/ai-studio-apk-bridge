<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, sans-serif; width: 280px; margin: 0; padding: 16px; background: #0f172a; color: #e2e8f0; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      p, li { font-size: 13px; line-height: 1.45; color: #cbd5e1; }
      ol { padding-left: 18px; margin: 8px 0 0; }
      .ok { color: #4ade80; font-weight: 600; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>AI Studio APK Bridge</h1>
    <p class="ok">Extension is installed</p>
    <ol>
      <li>Open <b>aistudio.google.com</b></li>
      <li>Look for the <b>APK Bridge</b> button (bottom right)</li>
      <li>Build your app, then tap <b>Install via USB</b></li>
      <li>Tap <b>Download APK</b> in the APK Bridge panel</li>
      <li>Open the downloaded file and tap <b>Install</b></li>
    </ol>
  </body>
</html>
